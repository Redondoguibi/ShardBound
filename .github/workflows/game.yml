name: ShardBound runtime
on:
  push:
    paths-ignore: ['BLOCKBENCH/**']
  pull_request:
    paths-ignore: ['BLOCKBENCH/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      SHARDBOUND_RENDER_DRIVER: warp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: runtime-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
      - name: Prepare pinned dependencies
        shell: pwsh
        run: |
          $revision = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg.git .tools/vcpkg
          if ($LASTEXITCODE) { throw 'vcpkg clone failed' }
          git -C .tools/vcpkg checkout $revision
          if ($LASTEXITCODE) { throw 'vcpkg pin failed' }
          & .tools/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/.tools/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and run complete suite
        shell: pwsh
        run: ./tools/build.ps1 -Preset ${{ matrix.preset }}
      - name: Create and verify portable archive
        if: matrix.preset == 'release'
        shell: pwsh
        run: ./tools/package.ps1 -SkipBuild -OutputDirectory "$env:GITHUB_WORKSPACE/dist/ShardBound-win64"
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.preset }}-validation
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/user/readiness-*/user/performance/*.json
      - name: Preserve portable build
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ShardBound-win64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*-verification.json
            dist/portable-check-*/**/*.json
            dist/portable-check-*/*.log
